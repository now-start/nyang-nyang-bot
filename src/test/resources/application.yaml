spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: ${NYANG_TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:55440/nyang_test?sslmode=disable}
    username: ${NYANG_TEST_DATABASE_USERNAME:nyang_test}
    password: ${NYANG_TEST_DATABASE_PASSWORD:nyang_test}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org:
      hibernate:
        orm.jdbc.bind: trace
