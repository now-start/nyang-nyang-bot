chzzk:
  chat:
    auto-connect-enabled: false
  client-id: ${CHZZK_CLIENT_ID:local-client}
  client-secret: ${CHZZK_CLIENT_SECRET:local-secret}
  redirect-uri: http://localhost:8080/login/oauth2/code/chzzk

nyang:
  timer:
    enabled: false
  local-auth:
    enabled: true
    login-page-enabled: true

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  devtools:
    restart:
      enabled: false
  datasource:
    url: ${NYANG_DATABASE_URL:jdbc:postgresql://localhost:5432/nyang_nyang_bot?sslmode=disable}
    username: ${NYANG_DATABASE_USERNAME:nyang}
    password: ${NYANG_DATABASE_PASSWORD:nyang}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: debug

google:
  spreadsheet:
    sync:
      enabled: false

otel:
  sdk:
    disabled: true
