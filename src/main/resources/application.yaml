spring:
  application:
    name: nyang-nyang-bot
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC

---

spring:
  config:
    activate:
      on-profile: "!local"
    import: ${SPRING_CONFIG_IMPORT:configserver:https://spring.nowstart.org/config}
